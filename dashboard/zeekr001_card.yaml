# Zeekr 001 dashboard card
#
# Before pasting:
#  1. Replace every  CAR_  below with your car's entity prefix.
#     Find it in Settings -> Devices & services -> Entities, search "battery level":
#     if it is  sensor.zeekr_001_battery_level  then CAR_ -> zeekr_001_
#  2. Save a top-view photo of the car (front pointing UP, transparent or plain
#     background, ~800x1200 px) as  /config/www/zeekr001_top.png
#     (it is served as /local/zeekr001_top.png; restart HA if www/ is new)
#  3. Install "Expander Card" from HACS (for the Charging / Climate drop-downs)
#
# Positions on the photo are percentages (left/top) - nudge them to fit your image.

type: vertical-stack
cards:
  # ---------- header: key numbers ----------
  - type: grid
    columns: 4
    square: false
    cards:
      - type: tile
        entity: sensor.CAR_battery_level
        name: Battery
        vertical: true
      - type: tile
        entity: sensor.CAR_range
        name: Range
        vertical: true
      - type: tile
        entity: sensor.CAR_interior_temperature
        name: Inside
        vertical: true
      - type: tile
        entity: sensor.CAR_odometer
        name: Odometer
        vertical: true

  # ---------- the car ----------
  - type: picture-elements
    image: /local/zeekr001_top.png
    elements:
      # doors (state only - turn active colour when open)
      - type: state-icon
        entity: binary_sensor.CAR_door_front_left
        icon: mdi:car-door
        style: {left: 18%, top: 40%}
      - type: state-icon
        entity: binary_sensor.CAR_door_front_right
        icon: mdi:car-door
        style: {left: 82%, top: 40%}
      - type: state-icon
        entity: binary_sensor.CAR_door_rear_left
        icon: mdi:car-door
        style: {left: 18%, top: 60%}
      - type: state-icon
        entity: binary_sensor.CAR_door_rear_right
        icon: mdi:car-door
        style: {left: 82%, top: 60%}
      # windows (state only)
      - type: state-icon
        entity: binary_sensor.CAR_window_front_left
        icon: mdi:car-door-lock
        style: {left: 30%, top: 40%}
      - type: state-icon
        entity: binary_sensor.CAR_window_front_right
        icon: mdi:car-door-lock
        style: {left: 70%, top: 40%}
      - type: state-icon
        entity: binary_sensor.CAR_window_rear_left
        icon: mdi:car-door-lock
        style: {left: 30%, top: 60%}
      - type: state-icon
        entity: binary_sensor.CAR_window_rear_right
        icon: mdi:car-door-lock
        style: {left: 70%, top: 60%}
      # all windows - the one real window control (tap = open/close)
      - type: state-icon
        entity: cover.CAR_all_windows
        icon: mdi:window-shutter
        tap_action: {action: toggle}
        hold_action: {action: more-info}
        style: {left: 50%, top: 50%}
      # hood / trunk state
      - type: state-icon
        entity: binary_sensor.CAR_hood
        icon: mdi:car-select
        style: {left: 50%, top: 12%}
      - type: state-icon
        entity: binary_sensor.CAR_trunk
        icon: mdi:car-back
        style: {left: 50%, top: 86%}
      # trunk open / close (the car toggles; asks to confirm)
      - type: icon
        icon: mdi:arrow-up-down-bold
        title: Trunk open / close
        tap_action:
          action: perform-action
          perform_action: button.press
          target: {entity_id: button.CAR_trunk_open_close}
          confirmation: {text: "Open / close the trunk? Make sure nobody is near it."}
        style: {left: 50%, top: 94%, color: var(--primary-color)}
      # charge port lid - toggle (locked = closed, unlocked = open)
      - type: state-icon
        entity: lock.CAR_charge_port_lid
        icon: mdi:ev-plug-type2
        tap_action:
          action: toggle
          confirmation: {text: "Open / close the charge port lid?"}
        hold_action: {action: more-info}
        style: {left: 14%, top: 76%}
      - type: state-label
        entity: lock.CAR_charge_port_lid
        style: {left: 14%, top: 82%, font-size: 11px}
      # tyre pressures at the wheels
      - type: state-label
        entity: sensor.CAR_tire_pressure_front_left
        style: {left: 10%, top: 24%, font-size: 12px}
      - type: state-label
        entity: sensor.CAR_tire_pressure_front_right
        style: {left: 90%, top: 24%, font-size: 12px}
      - type: state-label
        entity: sensor.CAR_tire_pressure_rear_left
        style: {left: 10%, top: 70%, font-size: 12px}
      - type: state-label
        entity: sensor.CAR_tire_pressure_rear_right
        style: {left: 90%, top: 70%, font-size: 12px}

  # ---------- quick actions ----------
  - type: grid
    columns: 4
    square: false
    cards:
      - type: button
        entity: lock.CAR_door_lock
        name: Lock
        tap_action:
          action: toggle
          confirmation: {text: "Lock / unlock the car?"}
      - type: button
        entity: button.CAR_flash_lights
        name: Flash
        icon: mdi:car-light-alert
        tap_action:
          action: perform-action
          perform_action: button.press
          target: {entity_id: button.CAR_flash_lights}
      - type: button
        entity: switch.CAR_sentry_mode
        name: Sentry
        tap_action: {action: toggle}
      - type: button
        entity: cover.CAR_sunshade
        name: Sunshade
        tap_action: {action: toggle}

  # ---------- charging drop-down ----------
  - type: custom:expander-card
    title: Charging
    expanded: false
    cards:
      - type: entities
        entities:
          - entity: switch.CAR_charging
            name: Charging
          - entity: binary_sensor.CAR_charger_plugged_in
            name: Plugged in
          - entity: number.CAR_charge_limit
            name: Charge limit
          - entity: sensor.CAR_charging_power
            name: Power
          - entity: sensor.CAR_charging_voltage
            name: Voltage
          - entity: sensor.CAR_charging_current
            name: Current
          - entity: sensor.CAR_estimated_full_charge_time
            name: Full in
          - type: section
            label: Schedule
          - entity: switch.CAR_charging_schedule
            name: Scheduled charging
          - entity: time.CAR_charging_start_time
            name: Start
          - entity: time.CAR_charging_end_time
            name: End
          - entity: lock.CAR_charge_port_lid
            name: Charge port lid

  # ---------- climate drop-down ----------
  - type: custom:expander-card
    title: Climate
    expanded: false
    cards:
      - type: thermostat
        entity: climate.CAR_climate
      - type: grid
        columns: 2
        square: false
        cards:
          - type: button
            entity: button.CAR_rapid_cooling
            name: Rapid cool
            tap_action:
              action: perform-action
              perform_action: button.press
              target: {entity_id: button.CAR_rapid_cooling}
          - type: button
            entity: button.CAR_rapid_heating
            name: Rapid heat
            tap_action:
              action: perform-action
              perform_action: button.press
              target: {entity_id: button.CAR_rapid_heating}
      - type: entities
        entities:
          - entity: number.CAR_climate_run_duration
            name: Run time
          - entity: select.CAR_seat_heating_driver
            name: Seat heat driver
          - entity: select.CAR_seat_heating_passenger
            name: Seat heat passenger
          - entity: select.CAR_seat_ventilation_driver
            name: Seat vent driver
          - entity: select.CAR_seat_ventilation_passenger
            name: Seat vent passenger
          - entity: switch.CAR_steering_wheel_heating
            name: Steering wheel
          - entity: switch.CAR_windshield_defrost
            name: Defrost
          - entity: sensor.CAR_exterior_temperature
            name: Outside
          - type: section
            label: Departure
          - entity: switch.CAR_departure_schedule
            name: Departure schedule
          - entity: datetime.CAR_scheduled_departure_time
            name: Departure time
          - entity: switch.CAR_departure_climate
            name: Pre-condition
